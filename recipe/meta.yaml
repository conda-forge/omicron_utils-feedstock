{% set name = "omicron_utils" %}
{% set version = "0.0.18" %}
{% set python_min = "3.10" %}

package:
  name: {{ name|lower }}
  version: {{ version }}

source:
  url: https://pypi.org/packages/source/{{ name[0] }}/{{ name }}/omicron_utils-{{ version }}.tar.gz
  sha256: 84baec0408da5f774ca93e1c5d880ac715831e913f1acccf190afd6092c2c078

build:
  entry_points:
    - omicron-config-utils = omicron_utils.config_utils:main
  noarch: python
  script: {{ PYTHON }} -m pip install . -vv --no-deps --no-build-isolation
  number: 0

requirements:
  host:
    - python {{ python_min }}
    - setuptools >=60
    - setuptools-scm >=3.4
    - wheel
    - pip
  run:
    - python >={{ python_min }},<3.12

test:
  imports:
    - omicron_utils
  commands:
    - pip check
    - omicron-config-utils --help
  requires:
    - pip
    - python {{ python_min }}

about:
  home: https://detchar.docs.ligo.org/omicron-gap/
  dev_url: https://git.ligo.org/joseph-areeda/omicron_utils
  summary: Collection of common classes and function supporting LIGO Omicron pipelines
  license: GPL-3.0-only
  license_file: LICENSE
  description: These classes support cofiguration file defsults for running the Omicron control programs and result plotter, not the trigger generatr. It also has classes for analyzing gaps and intervals for processing.


extra:
  recipe-maintainers:
    - areeda
